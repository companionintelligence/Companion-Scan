[package]
name = "companion-scan-desktop"
version = "0.2.1"
description = "Companion Scan desktop shell"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# tauri::generate_context!() reads the plugins section of tauri.conf.json with serde_json.
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Proc-macro dylibs (serde_derive, darling_macro, zerofrom-derive, phf_macros, ...) are compiled with the
# build-override profile, which inherits `strip = true` above. On macOS with the Xcode 27 linker a stripped
# proc-macro dylib fails to load ("mis-aligned LINKEDIT string pool"), so a release build stops at its first
# derive macro. Keep the proc-macro dylibs unstripped; the app binary itself is still stripped.
[profile.release.build-override]
strip = false
